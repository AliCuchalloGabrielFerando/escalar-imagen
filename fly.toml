# fly.toml app configuration for escalar-imagen
# See https://fly.io/docs/reference/configuration/ for information about this file.

app = 'escalar-imagen'
primary_region = 'gru'

[build]
  # Prevent Fly.io from setting NODE_ENV=production during build
  # which breaks Next.js static generation
  [build.env]
    NODE_ENV = ""

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256