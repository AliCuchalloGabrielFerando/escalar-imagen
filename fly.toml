# fly.toml app configuration for escalar-imagen
# See https://fly.io/docs/reference/configuration/ for information about this file.

app = 'escalar-imagen'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[experimental]
  # Permitir que la app escuche en todas las interfaces
  auto_rollback = true

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512